<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权运营商入驻申请 - 数据跨域流通平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(30, 64, 175, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); }

    /* 顶部导航 */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; padding: 0 40px; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100;
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px;
    }
    .nav-brand span { font-size: 16px; font-weight: 700; color: var(--text); }
    .nav-menu { display: flex; align-items: center; gap: 8px; list-style: none; }
    .nav-menu a {
      display: block; padding: 8px 16px; font-size: 14px;
      color: var(--text-secondary); text-decoration: none; border-radius: 6px; transition: all .15s;
    }
    .nav-menu a:hover { color: var(--primary); background: var(--bg); }
    .nav-menu a.active { color: var(--primary); background: #eff6ff; font-weight: 500; }
    .nav-right a { font-size: 14px; color: var(--text-secondary); text-decoration: none; }

    /* 页面头部 */
    .page-header {
      background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 50%, #e8f1ff 100%);
      padding: 40px 40px;
      border-bottom: 1px solid #eef2f7;
    }
    .page-header-inner { max-width: 900px; margin: 0 auto; }
    .breadcrumb { font-size: 13px; color: var(--text-tertiary); margin-bottom: 14px; }
    .breadcrumb a { color: var(--primary); text-decoration: none; }
    .page-title { font-size: 28px; font-weight: 800; color: #1e3a8a; margin-bottom: 10px; }
    .page-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

    /* 表单卡片 */
    .apply-card {
      max-width: 900px; margin: 32px auto 64px; background: #fff;
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px 48px;
    }
    .form-section { margin-bottom: 32px; }
    .form-section-title {
      font-size: 16px; font-weight: 700; color: var(--text);
      padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .form-section-title::before {
      content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--primary);
    }
    .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 14px; color: var(--text); margin-bottom: 8px; font-weight: 500; }
    .required { color: #ef4444; }
    .form-group input[type="text"],
    .form-group select,
    .form-group textarea {
      padding: 10px 14px; font-size: 14px; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; outline: none;
      transition: border-color .15s, box-shadow .15s; font-family: inherit;
    }
    .form-group input[type="text"]:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .form-group textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
    .form-tip { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; }

    /* 多选领域 */
    .domain-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .domain-check {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; font-size: 13px; color: var(--text-secondary);
      border: 1px solid var(--border); border-radius: 20px; cursor: pointer;
      transition: all .15s; user-select: none; background: #fff;
    }
    .domain-check:hover { border-color: var(--primary); color: var(--primary); }
    .domain-check.checked {
      border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 500;
    }
    .domain-check input { display: none; }

    /* 文件上传 */
    .upload-box {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 28px; border: 1px dashed var(--border); border-radius: 8px;
      color: var(--text-secondary); font-size: 14px; cursor: pointer;
      transition: all .15s; background: #fafbfe;
    }
    .upload-box:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    /* 提交区 */
    .form-actions {
      display: flex; gap: 16px; justify-content: center; padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 40px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; transition: all .2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(37,99,235,0.25); }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-ghost { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--primary); border-color: var(--primary); }

    @media (max-width: 768px) {
      .top-nav { padding: 0 20px; }
      .nav-menu { display: none; }
      .page-header { padding: 28px 20px; }
      .apply-card { margin: 20px 16px 48px; padding: 24px 20px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="home.html" class="nav-brand">
        <div class="logo-icon">Z</div>
        <span>数据跨域流通平台</span>
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="home.html">首页</a></li>
          <li><a href="data-products.html">数据产品</a></li>
          <li><a href="data-catalog.html">数据资源目录</a></li>
          <li><a href="demand-hall.html">需求大厅</a></li>
          <li><a href="operator-register.html" class="active">授权运营商入驻</a></li>
        </ul>
      </nav>
    </div>
    <div class="nav-right">
      <a href="index.html">登录</a>
    </div>
  </header>

  <!-- 页面头部 -->
  <section class="page-header">
    <div class="page-header-inner">
      <div class="breadcrumb"><a href="operator-register.html">授权运营商入驻</a> / 入驻申请</div>
      <h1 class="page-title">授权运营商入驻申请</h1>
      <p class="page-desc">请如实填写机构信息并提交资质材料，平台将对申请进行资质审核与安全评估，审核结果可在「入驻记录」中查看。</p>
    </div>
  </section>

  <!-- 申请表单 -->
  <section class="apply-card">
    <form id="applyForm">
      <div class="form-section">
        <div class="form-section-title">机构基本信息</div>
        <div class="form-row">
          <div class="form-group">
            <label>机构名称 <span class="required">*</span></label>
            <input type="text" id="operatorName" name="operatorName" placeholder="请输入机构全称" required>
          </div>
          <div class="form-group">
            <label>统一社会信用代码 <span class="required">*</span></label>
            <input type="text" id="creditCode" name="creditCode" placeholder="请输入 18 位统一社会信用代码" maxlength="18" required>
            <div class="form-tip">用于资质核验，请与营业执照保持一致</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>法定代表人 <span class="required">*</span></label>
            <input type="text" id="legalRep" name="legalRep" placeholder="请输入法定代表人姓名" required>
          </div>
          <div class="form-group">
            <label>业务范围 <span class="required">*</span></label>
            <select id="bizScope" name="bizScope" required>
              <option value="">请选择业务范围</option>
              <option>数据产品开发</option>
              <option>数据治理</option>
              <option>数据采集</option>
              <option>数据安全</option>
              <option>算法模型</option>
              <option>咨询服务</option>
            </select>
          </div>
        </div>
        <div class="form-group full">
          <label>申请领域 <span class="required">*</span></label>
          <div class="domain-group" id="domainGroup">
            <label class="domain-check"><input type="checkbox" value="工业制造">工业制造</label>
            <label class="domain-check"><input type="checkbox" value="现代农业">现代农业</label>
            <label class="domain-check"><input type="checkbox" value="商贸流通">商贸流通</label>
            <label class="domain-check"><input type="checkbox" value="交通运输">交通运输</label>
            <label class="domain-check"><input type="checkbox" value="金融服务">金融服务</label>
            <label class="domain-check"><input type="checkbox" value="文化旅游">文化旅游</label>
            <label class="domain-check"><input type="checkbox" value="医疗健康">医疗健康</label>
            <label class="domain-check"><input type="checkbox" value="应急管理">应急管理</label>
            <label class="domain-check"><input type="checkbox" value="城市治理">城市治理</label>
            <label class="domain-check"><input type="checkbox" value="生态环境">生态环境</label>
          </div>
          <div class="form-tip">可多选，建议控制在 3 个以内</div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">联系人信息</div>
        <div class="form-row">
          <div class="form-group">
            <label>联系人 <span class="required">*</span></label>
            <input type="text" id="contactName" name="contactName" placeholder="请输入联系人姓名" required>
          </div>
          <div class="form-group">
            <label>联系电话 <span class="required">*</span></label>
            <input type="text" id="contactPhone" name="contactPhone" placeholder="请输入 11 位手机号码" maxlength="11" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">安全评估材料</div>
        <div class="form-group full" style="margin-bottom:20px;">
          <label>数据安全自评估说明 <span class="required">*</span></label>
          <textarea id="securityDesc" name="securityDesc" placeholder="请说明机构数据安全管理组织架构、制度建设、数据分级分类方案及安全防护措施等" required></textarea>
        </div>
        <div class="form-group full">
          <label>附件材料</label>
          <label class="upload-box" for="attachment">
            <span>点击上传背景调查报告（选填）</span>
            <input type="file" id="attachment" name="attachment" style="display:none;" accept=".pdf,.doc,.docx">
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="resetForm()">重置</button>
        <button type="button" class="btn btn-primary" onclick="submitApply()">提交申请</button>
      </div>
    </form>
  </section>

  <script>
    var DOMAIN_FIELDS = ['工业制造','现代农业','商贸流通','交通运输','金融服务','文化旅游','医疗健康','应急管理','城市治理','生态环境'];

    function getRecords() {
      try { return JSON.parse(localStorage.getItem('operatorRecords') || '[]'); }
      catch (e) { return []; }
    }

    function saveRecords(list) {
      localStorage.setItem('operatorRecords', JSON.stringify(list));
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    // 领域多选样式
    function initDomainGroup() {
      document.querySelectorAll('.domain-check').forEach(function(label) {
        var input = label.querySelector('input');
        if (input.checked) label.classList.add('checked');
        label.addEventListener('click', function() {
          setTimeout(function() {
            label.classList.toggle('checked', input.checked);
          }, 0);
        });
      });
    }

    // 读取 reApply 参数并回填
    function initReApply() {
      var params = new URLSearchParams(location.search);
      var id = params.get('reApply');
      if (!id) return;
      var record = getRecords().find(function(r) { return r.id === id; });
      if (!record) return;
      document.getElementById('operatorName').value = record.operatorName || '';
      document.getElementById('creditCode').value = record.creditCode || '';
      document.getElementById('legalRep').value = record.legalRep || '';
      document.getElementById('bizScope').value = record.bizScope || '';
      document.getElementById('contactName').value = record.contactName || '';
      document.getElementById('contactPhone').value = record.contactPhone || '';
      var domains = String(record.domains || '').split(/、|,|，/).map(function(s) { return s.trim(); }).filter(Boolean);
      document.querySelectorAll('#domainGroup input[type="checkbox"]').forEach(function(input) {
        if (domains.indexOf(input.value) !== -1) input.checked = true;
      });
      initDomainGroup();
      var title = document.querySelector('.page-title');
      if (title) title.textContent = '授权运营商入驻申请（重新申请）';
    }

    function resetForm() {
      document.getElementById('applyForm').reset();
      initDomainGroup();
    }

    function submitApply() {
      var form = document.getElementById('applyForm');
      var inputs = form.querySelectorAll('input[required], select[required], textarea[required]');
      for (var i = 0; i < inputs.length; i++) {
        if (!inputs[i].value.trim()) {
          alert('请填写所有必填项');
          inputs[i].focus();
          return;
        }
      }
      var creditCode = document.getElementById('creditCode').value.trim();
      if (!/^[0-9A-HJ-NPQRTUWXY]{18}$/.test(creditCode)) {
        alert('请输入正确的 18 位统一社会信用代码');
        document.getElementById('creditCode').focus();
        return;
      }
      var phone = document.getElementById('contactPhone').value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入正确的 11 位手机号码');
        document.getElementById('contactPhone').focus();
        return;
      }
      var domains = Array.prototype.map.call(
        form.querySelectorAll('#domainGroup input[type="checkbox"]:checked'),
        function(input) { return input.value; }
      );
      if (domains.length === 0) {
        alert('请至少选择一个申请领域');
        return;
      }

      var now = new Date();
      var pad = function(n) { return String(n).padStart(2, '0'); };
      var id = 'OP' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
        pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());

      var record = {
        id: id,
        operatorName: document.getElementById('operatorName').value.trim(),
        creditCode: creditCode,
        legalRep: document.getElementById('legalRep').value.trim(),
        domains: domains.join('、'),
        bizScope: document.getElementById('bizScope').value,
        contactName: document.getElementById('contactName').value.trim(),
        contactPhone: phone,
        applyTime: now.toLocaleString('zh-CN', { hour12: false }),
        status: 'reviewing',
        progress: ['提交申请', '资质审核', '安全评估', '入驻开通'],
        remark: ''
      };

      var list = getRecords();
      list.unshift(record);
      saveRecords(list);

      alert('入驻申请已提交，请等待资质审核与安全评估。');
      location.href = 'operator-records.html';
    }

    initDomainGroup();
    initReApply();
  </script>
</body>
</html>
